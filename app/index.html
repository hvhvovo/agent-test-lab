<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Test Lab · 面试训练</title>
<style>
:root{font:16px/1.7 system-ui,sans-serif;color:#192b40;background:#f2f5f8}*{box-sizing:border-box}body{max-width:1120px;margin:auto;padding:30px 22px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:23px;margin:0 0 15px}h3{font-size:18px;line-height:1.7}p{margin:8px 0}a{color:#295bb4}small,.muted{color:#576a7c}section,.card{background:#fff;border:1px solid #dce3eb;border-radius:12px;padding:24px;margin:20px 0}label{display:block;font-weight:600;margin:10px 0 5px}textarea,input,select{font:inherit;border:1px solid #aebdcc;border-radius:6px;padding:10px;width:100%;background:#fff;color:inherit}textarea{resize:vertical}button{font:inherit;border:1px solid #b7c5d3;border-radius:6px;padding:8px 16px;cursor:pointer;background:#fff;color:#24445e}button.primary{background:#2355a7;color:white;border-color:#2355a7}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #e5a63a;outline-offset:3px}.row{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.row>div{flex:1;min-width:160px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.tag{display:inline-block;font-size:13px;background:#edf3fa;color:#36546e;padding:2px 9px;border-radius:4px;margin:0 6px 5px 0}details{border-top:1px solid #e6ebf0;margin-top:14px;padding-top:12px}summary{cursor:pointer;color:#254e84}.card{margin:14px 0;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f8;padding:14px;font-size:13px}.notice{padding:10px 14px;background:#edf3fa;border-radius:6px}.error{color:#a22020}.point{font-weight:400;display:flex;gap:10px;align-items:baseline}.point input{width:auto}.evidence{border-left:3px solid #82a6cf;padding-left:12px;margin:10px 0}ul,ol{padding-left:24px}#status{min-height:28px}.hidden{display:none!important}@media(max-width:620px){body{padding:18px 12px}header{display:block}section{padding:18px}h1{font-size:26px}}
</style>
</head>
<body>
<header><div><h1>Agent Test Lab</h1><p class="muted">岗位分析 · 场景面试 · 测试与复盘</p></div><a href="/docs" target="_blank" rel="noopener">API 文档 ↗</a></header>
<nav class="actions" aria-label="功能"><button id="tab-analysis" class="primary">岗位训练</button><button id="tab-bank">浏览题库</button><button id="history">历史与复盘</button></nav>
<section id="input-panel"><h2>准备一场有针对性的面试</h2><p class="muted">先粘贴岗位要求，再补充项目材料。题库按技能和难度选题，个人资料用于查找相关证据。</p>
<form id="form"><label for="jd">岗位描述</label><textarea id="jd" rows="3" maxlength="10000" required>熟悉 Python、pytest 和 FastAPI，了解 RAG、Agent 与工具调用，能设计接口自动化测试。</textarea>
<label for="profile">项目材料（选填）</label><textarea id="profile" rows="3" maxlength="20000" placeholder="粘贴真实的项目过程、职责和测试记录。不要填写密钥。"></textarea>
<p class="muted"><small>也可导入本地 UTF-8 文本，内容会放入上方输入框。</small></p><input id="profile-file" type="file" accept=".txt,.md" aria-label="导入文本资料">
<div class="row"><div><label for="mode">出题方式</label><select id="mode"><option value="offline">场景题库 · 无需密钥</option><option value="llm">模型出题 · 会发送 JD 与检索资料</option></select></div><div><label for="level">题库难度</label><select id="level"><option>全部</option><option>中等</option><option>深入</option></select></div><div><label for="count">题库题数上限</label><select id="count"><option>3</option><option selected>5</option><option>10</option></select></div></div>
<p class="muted"><small>难度与题数筛选用于题库模式；模型模式最多生成 5 题。当前服务仅供本机使用。</small></p>
<button id="submit" class="primary" style="margin-top:16px">生成训练报告</button></form></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="bank-panel" class="hidden"><h2>场景题库</h2><div class="row"><div><label for="bank-query">搜索题目或技能</label><input id="bank-query" placeholder="例如：超时、RAG、事务"></div><div><label for="bank-level">难度</label><select id="bank-level"><option>全部</option><option>中等</option><option>深入</option></select></div></div><p id="bank-count" class="muted"></p><div id="bank-items"></div></section>
<section id="history-panel" class="hidden"><h2>历史与复盘</h2><div id="history-items"></div><div class="actions"><button id="prev-page">上一页</button><button id="next-page">下一页</button></div></section>
<section id="result-panel" class="hidden"><div class="row"><h2>训练报告</h2><button id="export">导出报告与复盘 JSON</button></div><div id="summary"></div><div id="questions"></div><details><summary>资料证据与检索记录</summary><div id="evidence"></div><pre id="trace"></pre></details><details><summary>完整报告 JSON</summary><pre id="output"></pre></details></section>
<script>
const $=id=>document.getElementById(id);
let current=null, bank=[], offset=0;
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':''}
async function request(url,options){let r;try{r=await fetch(url,options)}catch{throw Error('无法连接本机服务。请确认终端中的服务仍在运行，再刷新页面。')}let data;try{data=await r.json()}catch{throw Error('服务没有返回有效 JSON，请查看终端日志。')}if(!r.ok){const detail=Array.isArray(data.detail)?data.detail.map(x=>x.loc.join('.')+'：'+x.msg).join('；'):data.detail;throw Error(detail||'请求失败')}return data}
function list(parent,items){const ul=node('ul');for(const x of items||[])ul.append(node('li',x));parent.append(ul)}
function reference(card,q,report){if(q.grounding_guard){const names={negation:'否定表达',plan:'计划内容',ownership:'团队或他人归属',instruction:'资料中的指令',no_evidence:'缺少经历依据',unknown_evidence:'引用无法核对'};card.append(node('p','已改为假设场景：'+q.grounding_guard.reasons.map(r=>names[r]||r).join('、')+'。规则可能误判，可对照原资料复核。','notice'));}if(!q.evidence_ids?.length){card.append(node('p','通用场景题，不假定你做过题目中的项目。','muted'));return}for(const id of q.evidence_ids){const hit=report.evidence_chunks?.find(c=>c.id===id);card.append(node('p',hit?id+'：'+hit.text:'引用 '+id+'（旧报告未保存片段正文）','evidence'))}}
function questionCard(q,index,report,review){const card=node('article',undefined,'card');const tags=node('div');for(const t of [q.category||'模型面试题',q.level||'',...(q.matched_skills||q.skills||[])].filter(Boolean))tags.append(node('span',t,'tag'));card.append(tags,node('h3',(index+1)+'. '+q.question));if(report)reference(card,q,report);
let answer,checks=[],confidence,notes;
if(report){const label=node('label','先写下你的回答');answer=node('textarea');answer.rows=4;answer.maxLength=10000;answer.value=review?.answer||'';answer.setAttribute('aria-label','第'+(index+1)+'题回答');label.append(answer);card.append(label)}
const follow=node('details');follow.append(node('summary','继续追问'));list(follow,q.follow_ups?.length?q.follow_ups:['你会怎样构造失败样例，并用测试证明修复有效？']);card.append(follow);
const rubric=node('details');rubric.append(node('summary','对照考察点与常见误区'));rubric.append(node('p','要点用于自查，不是唯一答案，也不会自动判定你的回答正确。','muted'));for(const [i,p] of (q.checkpoints||[]).entries()){if(report){const label=node('label',undefined,'point');const c=node('input');c.type='checkbox';c.checked=review?.covered_points?.includes(i)||false;checks.push(c);label.append(c,node('span',p));rubric.append(label)}else rubric.append(node('p','• '+p))}if(!q.checkpoints?.length)rubric.append(node('p','本题未提供具体考察点，请人工核对回答。'));if(q.pitfalls?.length){rubric.append(node('strong','常见误区'));list(rubric,q.pitfalls)}card.append(rubric);
if(report){confidence=node('select');confidence.setAttribute('aria-label','自评掌握情况');for(const v of ['需复习','部分掌握','能独立解释']){const o=node('option',v);o.value=v;confidence.append(o)}confidence.value=review?.confidence||'需复习';notes=node('textarea');notes.rows=2;notes.maxLength=3000;notes.placeholder='复盘：遗漏了什么？下一次怎么回答？';notes.setAttribute('aria-label','复盘笔记');notes.value=review?.notes||'';const save=node('button',review?'更新复盘':'保存回答与自评','primary');const state=node('span',review?'已保存 · '+review.confidence:'','muted');save.onclick=async()=>{if(!answer.value.trim()){state.textContent='先写下回答，再保存。';return}save.disabled=true;try{await request('/api/reports/'+report.id+'/answers/'+index,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:answer.value,covered_points:checks.flatMap((c,i)=>c.checked?[i]:[]),confidence:confidence.value,notes:notes.value})});state.textContent='已保存 · '+confidence.value}catch(e){state.textContent=e.message}finally{save.disabled=false}};const row=node('div',undefined,'actions');row.append(save,state);card.append(node('label','自评掌握情况'),confidence,node('label','复盘笔记'),notes,row)}return card}
async function showReport(report){current=report;$('result-panel').classList.remove('hidden');$('summary').replaceChildren();$('questions').replaceChildren();$('evidence').replaceChildren();$('summary').append(node('p','报告 #'+report.id+' · '+(report.mode==='llm'?'模型出题':'场景题库')+' · 分析耗时 '+report.duration_ms+' ms'),node('p','岗位提及：'+(report.required_skills.join('、')||'未识别到词表中的技能')),node('p','当前资料未检出：'+(report.unverified_skills.join('、')||'无')));if(report.question_selection?.matched===0)$('summary').append(node('p','题库暂无对应题目，以下为项目复盘题。','notice'));$('summary').append(node('p','技能提及不证明掌握程度；否定句、计划经历需人工核对。','muted'));let reviews=[];try{reviews=await request('/api/reports/'+report.id+'/answers')}catch(e){status('报告已加载，但复盘读取失败：'+e.message,true)}report.questions.forEach((q,i)=>$('questions').append(questionCard(q,i,report,reviews.find(r=>r.question_index===i))));for(const e of report.evidence){$('evidence').append(node('h3',e.skill+' · '+(e.status==='mentioned'?'资料有提及':'资料未检出')));for(const c of e.citations)$('evidence').append(node('p',c.id+'：'+c.text,'evidence'))}$('trace').textContent=JSON.stringify(report.tool_trace,null,2);$('output').textContent=JSON.stringify(report,null,2)}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;status('正在生成…');try{const text=$('profile').value.trim();const report=await request('/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jd:$('jd').value,documents:text?[{source:'个人资料',text}]:[],mode:$('mode').value,question_count:Number($('count').value),level:$('level').value})});status('报告已生成并保存。');await showReport(report);$('result-panel').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){status(e.message,true)}finally{$('submit').disabled=false}};
$('profile-file').onchange=async()=>{const file=$('profile-file').files[0];if(!file)return;if(file.size>100000){status('文本文件过大，请保留 20000 字以内的相关材料。',true);return}try{const text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());if(text.length>20000)throw Error('资料超过 20000 字，请先精简。');$('profile').value=text;status('已读入文本，请核对后再生成报告。')}catch(e){status('读取失败，请使用 UTF-8 文本。'+e.message,true)}};
function panels(which){for(const id of ['input-panel','bank-panel','history-panel'])$(id).classList.toggle('hidden',id!==which)}
$('tab-analysis').onclick=()=>panels('input-panel');
function renderBank(){const query=$('bank-query').value.toLowerCase();const level=$('bank-level').value;const items=bank.filter(q=>(level==='全部'||q.level===level)&&JSON.stringify(q).toLowerCase().includes(query));$('bank-count').textContent=items.length+' 道题';$('bank-items').replaceChildren(...items.map((q,i)=>questionCard(q,i)))}
$('tab-bank').onclick=async()=>{panels('bank-panel');try{bank=await request('/api/questions');renderBank();status('')}catch(e){status(e.message,true)}};$('bank-query').oninput=renderBank;$('bank-level').onchange=renderBank;
async function history(){panels('history-panel');try{const items=await request('/api/reports?limit=10&offset='+offset);$('history-items').replaceChildren();for(const r of items){const b=node('button','#'+r.id+' · '+r.jd.slice(0,75));b.style.display='block';b.style.marginBottom='10px';b.onclick=async()=>{try{await showReport(r);$('result-panel').scrollIntoView({behavior:'smooth'})}catch(e){status(e.message,true)}};$('history-items').append(b)}if(!items.length)$('history-items').append(node('p','暂无报告'));$('prev-page').disabled=offset===0;$('next-page').disabled=items.length<10;status('')}catch(e){status(e.message,true)}}
$('history').onclick=()=>{offset=0;history()};$('prev-page').onclick=()=>{offset=Math.max(0,offset-10);history()};$('next-page').onclick=()=>{offset+=10;history()};
$('export').onclick=async()=>{if(!current)return;try{const answers=await request('/api/reports/'+current.id+'/answers');const blob=new Blob([JSON.stringify({report:current,answers},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=node('a');a.href=url;a.download='interview-report-'+current.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){status(e.message,true)}};
</script></body></html>
